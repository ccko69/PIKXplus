#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Wed Aug 26 19:41:46 GMT 2026
org.gradle.caching=true
android.nonTransitiveRClass=true
org.gradle.daemon.maxConcurrency=2
org.gradle.daemon.idletimeout=10800000
systemProp.user.country=US
systemProp.user.language=en
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx820m -XX\:MaxMetaspaceSize\=512m -XX\:+UseParallelGC -Dfile.encoding\=UTF-8
android.enableJetifier=true
android.useAndroidX=true
org.gradle.workers.max=2
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
android.build.cache.enabled=true
org.gradle.configuration-cache=true
